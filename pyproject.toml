[project]
name = "piimask-tryit"
version = "0.1.0"
description = "Masks personal data in your prompts on your own computer, before they reach an AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/piimask/detect/data/LICENSES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46",
]

[project.scripts]
piimask-tryit = "piimask.localapp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piimask"]
include = [
    "src/piimask/**/*.py",
    "src/piimask/detect/data/*",
    "src/piimask/localapp/web/*",
]
